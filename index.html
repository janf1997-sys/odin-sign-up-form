<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up Form</title>
    <link
      rel="preload"
      href="assets/fonts/Roboto-VariableFont_wdth_wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/RobotoMono-VariableFont_wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="scripts.js" defer></script>
  </head>
  <body>
    <main>
      <div id="left">
        <div class="logo-container">
          <img src="assets/Default.svg" width="100" />
          <p class="logo-text">Janf_</p>
        </div>
        <div class="credits">
          Photo by
          <a
            href="https://unsplash.com/de/fotos/grune-blattpflanze-in-nahaufnahme-25xggax4bSA"
            >Halie West</a
          >
          on <a href="https://unsplash.com/de">Unsplash</a>
        </div>
      </div>
      <div id="right">
        <div id="top">
          <p>
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams.<br />
            Sign up <span>now</span> to get started.<br /><br />
            You <span>know</span> you want to.
          </p>
        </div>

        <form>
          <div class="upper">
            <h2>Let's do this!</h2>
            <div class="input">
              <label for="first-name">First Name</label>
              <input type="text" id="first-name" name="first-name" />
            </div>
            <div class="input">
              <label for="last-name">Last Name</label>
              <input type="text" id="last-name" name="last-name" />
            </div>
            <div class="input">
              <label for="mail">Email</label>
              <input type="email" id="mail" name="mail" />
            </div>
            <div class="input">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" />
            </div>
            <div class="input">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" />
            </div>
            <div class="input">
              <label for="confirm">Confirm Password</label>
              <input type="password" id="confirm" name="confirm" />
            </div>
          </div>
          <div class="lower">
            <button type="submit">Create Account</button>
            <p>Already have an account? <a>Log in</a></p>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
